name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

jobs:
  lint:
    name: PHP Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-scripts --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, dom, curl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      # Feature tests that render an Inertia page (login, register, profile, ...)
      # go through resources/views/app.blade.php, which calls @vite(...). That
      # throws a ViteManifestNotFoundException (500) unless public/build/manifest.json
      # exists. public/build is gitignored now (built once in the `build` job,
      # shipped straight to the server, never committed), so this job needs its
      # own throwaway build. Content doesn't matter here: PHPUnit only inspects
      # the Inertia page/props payload, it never executes the JS.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets (for Vite manifest only)
        run: npm run build

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Vite resolves VITE_* keys (and the ${VAR} nesting used by
      # VITE_GOOGLE_CLIENT_ID) from a real .env file at build time, the same
      # way `php artisan` does. Without one, import.meta.env.VITE_GOOGLE_CLIENT_ID
      # is silently undefined and Google Sign-In breaks in the built bundle.
      - name: Prepare production env for build
        run: |
          cp .env.example .env
          sed -i "s|^APP_NAME=.*|APP_NAME=\"${APP_NAME}\"|" .env
          sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}|" .env
        env:
          APP_NAME: ${{ vars.APP_NAME || 'Financialite' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build frontend assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1
